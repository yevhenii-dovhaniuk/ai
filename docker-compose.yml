# Запуск:
#   docker compose up -d --build                    → http://<IP>:3000
#   docker compose --profile https up -d --build    → https://<DOMAIN> (потрібен домен у .env)
services:
  ai:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${AI_PUBLISH:-3000}:3000"
    volumes:
      - ./checkpoints:/app/checkpoints # ваги моделі переживають перезбірку контейнера
    restart: unless-stopped

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    depends_on: [ai]
    environment:
      DOMAIN: ${DOMAIN:?Вкажіть DOMAIN у .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
